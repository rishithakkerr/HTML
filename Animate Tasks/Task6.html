<!DOCTYPE html>
<html lang="en">
<head>
    <title>
    Bounce
    </title>
    <style>
        #circle{
            box-shadow: 10 10 20px rgb(0, 0, 0);

        }

    </style>
</head>
<body style="margin: 0;">
    <svg width="100%" height="100vh" style="border: 1px solid black">
      <circle id="circle" cx="300" cy="390" r="40" fill="blue">
            <animate
            attributeName="cx"
            from="100"
            to="900"
            dur="3s"
            repeatCount="indefinite"
            direction="alternate" />
            
            <animate
            attributeName="cy"
            from="390"
            to="175"
            dur="2s"
            repeatCount="indefinite"
            direction="alternate"/>
        </circle>
