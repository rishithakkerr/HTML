<!DOCTYPE html>
<html>
    <head>
        <title>Car</title>
    </head>
<body style="margin:0;">
<svg width="100%" height="100vh" style="border:1px solid black">

    <rect x="0" y="0" width="100%" height="100vh" fill="#87CEEB"/>
        <rect x="0" y="550" width="100%" height="275" fill="grey"/>
        <line x1="0" y1="675" x2="100%" y2="675" stroke="white" stroke-width="4" stroke-dasharray="20,10"/>
        <rect x="0" y="275" width="100%" height="275" fill="green"/>
        <circle cx="1020" cy="60" r="30" fill="orange"/>

  <rect y="600" width="200" height="50" fill="violet" rx="10" ry="10">
    <animate 
    attributeName="x" 
    from="50" 
    to="800" 
    dur="4s" 
    repeatCount="indefinite"/>
  </rect>

  <rect y="560" width="120" height="40" fill="white">
    <animate 
    attributeName="x" 
    from="90" 
    to="840" 
    dur="4s" 
    repeatCount="indefinite"/>
  </rect>

  <rect y="565" width="45" height="30" fill="blue">
    <animate 
    attributeName="x" 
    from="100" 
    to="850" 
    dur="4s" 
    repeatCount="indefinite"/>
  </rect>

  <rect y="565" width="45" height="30" fill="blue">
    <animate 
    attributeName="x" 
    from="155" 
    to="905" 
    dur="4s" 
    repeatCount="indefinite"/>
  </rect>


  <circle cy="660" r="20" fill="black">
    <animate 
    attributeName="cx" 
    from="90" 
    to="840" 
    dur="4s" 
    repeatCount="indefinite"/>
  </circle>

  <circle cy="660" r="20" fill="black">
    <animate 
    attributeName="cx" 
    from="210" 
    to="960" 
    dur="4s" 
    repeatCount="indefinite"/>
  </circle>

</svg>
</body>
</html>
