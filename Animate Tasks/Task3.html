<!DOCTYPE html>
<html lang="en">
<head>
    <title>House sketch</title>
    <style>
        .line{
            fill:brown;
        }

    </style>
</head>
<body style="margin: 0;">
    <svg width="100%" height="100vh" style="border: 1px solid black">
        <rect x="0" y="0" width="100%" height="100vh" fill="#87CEEB"/>
        <rect x="0" y="550" width="100%" height="275" fill="grey"/>
        <line x1="0" y1="675" x2="100%" y2="675" stroke="white" stroke-width="4" stroke-dasharray="20,10"/>
        <rect x="0" y="275" width="100%" height="275" fill="green"/>
        <rect x="450" y="200" width="400" height="350" fill="yellow"/>
        <line class="line" x1="450" y1="200" x2="650" y2="50" stroke="brown" stroke-width="4"/>
        <line class="line" x1="850" y1="200" x2="650" y2="50" stroke="brown" stroke-width="4"/>
        <line class="line" x1="450" y1="200" x2="850" y2="200" stroke="brown" stroke-width="4"/>
        <rect x="490" y="250" width="100" height="100" fill="#87CEEB"/>
        <rect x="710" y="250" width="100" height="100" fill="#87CEEB"/>
        <rect x="600" y="375" width="100" height="175" fill="brown"/>
        <circle cx="1020" cy="60" r="30" fill="orange"/>
    </svg>
</body>
